name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :psdcore:test --no-daemon

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: psdcore/build/reports/tests/test
          if-no-files-found: ignore
