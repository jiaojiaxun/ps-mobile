name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (for example 0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      # The signing key is held as repository secrets so that every release carries the same
      # certificate — an update signed differently would be rejected by Android.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set; a release must be properly signed."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          cat > "$RUNNER_TEMP/signing/keystore.properties" <<PROPS
          storeFile=$RUNNER_TEMP/signing/release.jks
          storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}
          keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          PROPS

      - name: Unit tests
        run: ./gradlew :psdcore:test --no-daemon

      - name: Assemble release
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version }}
          SIGNING_KEYSTORE_PROPERTIES: ${{ runner.temp }}/signing/keystore.properties
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify the APK is signed with the release key
        run: |
          APK="app/build/outputs/apk/release/ps-mobile-${{ steps.version.outputs.version }}.apk"
          ls -la "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -20

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="app/build/outputs/apk/release/ps-mobile-$VERSION.apk"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$APK" --clobber
          else
            gh release create "v$VERSION" "$APK" \
              --title "PS Mobile $VERSION" \
              --generate-notes
          fi

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
