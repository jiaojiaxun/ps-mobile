name: Chinese APK

on:
  workflow_dispatch:
  push:
    branches: [zh-build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply localisation patch
        run: python3 scripts/zh/apply_zh.py

      - name: Apply layer-move patch
        run: python3 scripts/zh/apply_move.py

      - name: Apply layer-move app patch
        run: python3 scripts/zh/apply_move_app.py

      - name: Apply layer-move ux patch
        run: python3 scripts/zh/apply_move_ux.py

      - name: Unit tests
        run: |
          set +e
          ./gradlew :psdcore:test --console=plain --no-daemon 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          grep -E "^e: " /tmp/test.log | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E "FAILED|AssertionError|error:" /tmp/test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          exit $status

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -oP '^appVersionName=\K.*' gradle.properties | tr -d '[:space:]')"
          APK="app/build/outputs/apk/release/ps-mobile-$VERSION.apk"
          test -f "$APK"
          ls -la "$APK"
          TAG="zh-rel-$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "PS Mobile $VERSION 简体中文" \
              --notes "Simplified Chinese build of JustRin/ps-mobile. R8-minified; signed with the debug key so it installs directly."
          gh release upload "$TAG" "$APK" --clobber
          echo "APK published: release $TAG"
